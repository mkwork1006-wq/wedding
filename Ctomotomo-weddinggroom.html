<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-nav">
      <button class="hamburger" aria-label="メニューを開く" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav-menu" aria-hidden="true">
        <a href="index.html">ホーム</a>
        <a href="bride.html">新婦プロフィール</a>
        <a href="gallery.html">ギャラリー</a>
        <a href="qa.html">Q＆A</a>
      </nav>
    </div>
    <div class="image-placeholder">【新郎のイメージ】</div>
    <div class="hero-text">
      <p>新郎　○○　○○</p>
      <h1>新郎プロフィール</h1>
      <p class="hero-date">笑顔でつなぐ未来</p>
    </div>
  </header>

  <main>
    <section>
      <h2>ひとこと</h2>
      <p>友人や家族を大切にする穏やかな性格。休日はカメラを片手に自然の中を歩くのが好きです。</p>
    </section>

    <section>
      <h2>ポイント</h2>
      <ul class="notes-list">
        <li>出身：北海道札幌市</li>
        <li>趣味：写真、コーヒー屋さん巡り、読書</li>
        <li>職業：設計技師としてものづくりの現場をサポート</li>
        <li>性格：細やかな気配りが好き、ユーモアも忘れない</li>
        <li>大切にすること：ゲストの笑顔を自分ごとに感じる姿勢</li>
      </ul>
    </section>
  </main>

  <footer>
    <p><a href="index.html" class="panel-button">トップに戻る</a></p>
  </footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const menu = document.querySelector('.nav-menu');

    hamburger.addEventListener('click', () => {
      const expanded = hamburger.getAttribute('aria-expanded') === 'true';
      hamburger.setAttribute('aria-expanded', String(!expanded));
      menu.classList.toggle('open');
      menu.setAttribute('aria-hidden', String(expanded));
    });
  </script>
</body>
